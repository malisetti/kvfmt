[package]
name = "kvfmt"
version = "0.1.0"
edition = "2021"
description = "JSON ↔ logfmt bidirectional converter (streaming variant)"
license = "MIT"

[[bin]]
name = "kvfmt"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
